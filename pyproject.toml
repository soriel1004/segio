[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "segio-archive"
dynamic = ["version"]
description = "SEGIO 결재 문서와 메일의 Windows 오프라인 보관 도구"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4==4.14.3", "playwright==1.62.0", "paramiko==4.0.0"]

[project.scripts]
segio-archive = "segio_archive.__main__:main"

[tool.setuptools.packages.find]
include = ["segio_archive*"]

[tool.setuptools.package-data]
segio_archive = ["browser_assets/*"]

[tool.setuptools.dynamic]
version = {attr = "segio_archive.__version__"}
